---
---
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title | default: 'Mente Mirror' }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/mm-site.css' | relative_url }}">
  {% if site.logo %}<link rel="icon" href="{{ site.logo | relative_url }}">{% endif %}
</head>
<body class="mm-body {% if page.body_class %}{{ page.body_class }}{% endif %}">
  <a class="mm-skip-link" href="#main-content">Skip to content</a>
  {% include mm-header.html %}
  <main id="main-content">
    {{ content }}
  </main>
  {% include mm-footer.html %}
  <script src="{{ '/assets/js/mm-site.js' | relative_url }}" defer></script>
</body>
</html>
